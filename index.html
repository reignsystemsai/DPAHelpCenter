window.calculateDTI=function(){
const clean=v=>Number(String(v||"").replace(/[^0-9.]/g,""))||0;
const income=clean(document.getElementById("income").value);
const debts=clean(document.getElementById("debts").value);
const payment=clean(document.getElementById("payment").value);
const support=clean(document.getElementById("support").value);
const box=document.getElementById("dtiResults");
const num=document.getElementById("dtiNumber");
const copy=document.getElementById("dtiCopy");

box.classList.add("show");

if(income<=0){
num.textContent="0%";
copy.textContent="Enter your monthly income to calculate your debt-to-income estimate.";
return;
}

const dti=Math.round(((debts+payment+support)/income)*100);
num.textContent=dti+"%";

copy.textContent=dti<=43
?"This looks stronger. Your estimated DTI may be within a workable range for many loan programs."
:dti<=57
?"This may need lender review. Some programs may allow higher DTI, but your full file must be reviewed."
:"This looks high. Reducing monthly debts may improve your buying power before moving forward.";
};

}

let leadData={
lead_id:getStableLeadId(),
item_name:"",
source:"DPA Help Center Desktop Funnel",
created_at:sessionStorage.getItem("dpa_created_at")||new Date().toISOString(),
last_updated_at:"",
submission_stage:"Started",
submit_type:"",
first_home:"yes",
city:"",
zip:"",
home_price:400000,
estimated_dpa:20000,
first_name:"",
last_name:"",
email:"",
phone:"",
readiness_score:0,
credit_score:680,
household_income:90000,
employment_history:"",
tax_return_history:"",
credit_answered:false,
income_answered:false,
employment_answered:false,
taxes_answered:false,
credit_640_plus:null,
income_70k_plus:null,
job_history_2yrs:null,
tax_returns_2yrs:null,
route:"",
results_url:"",
final_submitted:false,
final_submitted_at:""
};

sessionStorage.setItem("dpa_created_at",leadData.created_at);
document.getElementById("leadIdField").value=leadData.lead_id;

const questions=[
{type:"credit",mini:"QUESTION 1 OF 4"},
{type:"income",mini:"QUESTION 2 OF 4"},
{type:"employment",mini:"QUESTION 3 OF 4"},
{type:"taxes",mini:"QUESTION 4 OF 4"}
];

function fmt(n){return "$"+Math.round(n).toLocaleString()}
function yn(v){return v===true?"Yes":v===false?"No":""}

function buildItemName(){
const n=((leadData.first_name||"")+" "+(leadData.last_name||"")).trim();
return n||leadData.email||leadData.phone||(leadData.city&&leadData.zip?"DPA Lead - "+leadData.city+" "+leadData.zip:"DPA Lead - "+leadData.lead_id);
}

function calculateScore(){
let s=0;
if(leadData.credit_answered&&leadData.credit_score>=640)s+=25;
if(leadData.income_answered&&leadData.household_income>=70000)s+=25;
if(leadData.employment_answered&&leadData.job_history_2yrs===true)s+=25;
if(leadData.taxes_answered&&leadData.tax_returns_2yrs===true)s+=25;

leadData.credit_640_plus=leadData.credit_answered?leadData.credit_score>=640:null;
leadData.income_70k_plus=leadData.income_answered?leadData.household_income>=70000:null;
leadData.readiness_score=s;
return s;
}

function buildDeficiencyList(){
let a=[];
if(leadData.credit_640_plus===false)a.push({key:"credit",param:"credit=1",url:CREDIT_URL});
if(leadData.income_70k_plus===false)a.push({key:"dti",param:"dti=1",url:DTI_URL});
if(leadData.job_history_2yrs===false)a.push({key:"job",param:"job=1",url:JOB_URL});
if(leadData.tax_returns_2yrs===false)a.push({key:"taxes",param:"taxes=1",url:TAXES_URL});
return a;
}

function buildResultsUrl(){
const d=buildDeficiencyList();

if(d.length===0){
leadData.route="qualified_begin_application";
leadData.results_url=APPLICATION_URL;
return APPLICATION_URL;
}

leadData.route=d.map(i=>i.key+"_review").join("|");
const q=d.map(i=>i.param).join("&");
leadData.results_url=PREPHUB_URL+"?"+q+"&score="+encodeURIComponent(leadData.readiness_score)+"&route="+encodeURIComponent(leadData.route)+"&lead="+encodeURIComponent(leadData.lead_id);
return leadData.results_url;
}

function makePayload(){
leadData.item_name=buildItemName();
leadData.last_updated_at=new Date().toISOString();

return{
lead_id:leadData.lead_id,
item_name:leadData.item_name,
source:leadData.source,
created_at:leadData.created_at,
last_updated_at:leadData.last_updated_at,
submission_stage:leadData.submission_stage,
submit_type:leadData.submit_type,
first_home:leadData.first_home||"",
city:leadData.city||"",
zip:leadData.zip||"",
home_price:Number(leadData.home_price)||0,
estimated_dpa:Number(leadData.estimated_dpa)||0,
first_name:leadData.first_name||"",
last_name:leadData.last_name||"",
email:leadData.email||"",
phone:(leadData.phone||"").replace(/\D/g,""),
readiness_score:Number(leadData.readiness_score)||0,
credit_score:Number(leadData.credit_score)||0,
household_income:Number(leadData.household_income)||0,
employment_history:leadData.employment_history||"",
tax_return_history:leadData.tax_return_history||"",
credit_answered:leadData.credit_answered?"Yes":"No",
income_answered:leadData.income_answered?"Yes":"No",
employment_answered:leadData.employment_answered?"Yes":"No",
taxes_answered:leadData.taxes_answered?"Yes":"No",
credit_640_plus:yn(leadData.credit_640_plus),
income_70k_plus:yn(leadData.income_70k_plus),
job_history_2yrs:yn(leadData.job_history_2yrs),
tax_returns_2yrs:yn(leadData.tax_returns_2yrs),
route:leadData.route||"",
results_url:leadData.results_url||"",
final_submitted:leadData.final_submitted?"Yes":"No",
final_submitted_at:leadData.final_submitted_at||""
};
}

function updateHiddenPayload(){
document.getElementById("leadPayloadField").value=JSON.stringify(makePayload());
}

async function sendPrepHubIntake(t){
leadData.submit_type=t;
const p=makePayload();
document.getElementById("leadPayloadField").value=JSON.stringify(p);

const response=await fetch(PREPHUB_INTAKE_URL,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_PUBLISHABLE_KEY,
"Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY
},
body:JSON.stringify(p),
keepalive:true
});

const result=await response.json().catch(()=>({}));
if(!response.ok)throw new Error(result.error||"PrepHub could not save your plan.");
localStorage.setItem("dpa_prephub_email",leadData.email);
localStorage.setItem("dpa_prephub_lead_id",leadData.lead_id);
localStorage.setItem("dpa_prephub_score",String(leadData.readiness_score));
localStorage.setItem("dpa_prephub_first_name",leadData.first_name);
return result;
}

window.dpaValidateLocation=function(){
const c=document.getElementById("buyerCity").value.trim();
const z=document.getElementById("buyerZip").value.replace(/\D/g,"").slice(0,5);
document.getElementById("buyerZip").value=z;

const ready=c.length>=2&&z.length===5;
const btn=document.getElementById("locationNextBtn");

btn.disabled=!ready;
btn.classList.toggle("ready",ready);

leadData.city=c;
leadData.zip=z;
leadData.submission_stage="Location Entered";
updateHiddenPayload();
};

window.dpaContinueFromLocation=function(){
dpaValidateLocation();
leadData.submission_stage="Location Submitted";
updateHiddenPayload();
dpaGoToStep(2);
};

window.dpaGoToStep=function(step){
currentStep=step;

document.querySelectorAll("#dpa-desktop-funnel .dpa-step-screen").forEach(s=>{
s.style.display="none";
s.classList.remove("show");
});

const id=step===1?"screenOne":step===2?"screenTwo":step===3?"screenThree":"screenFinal";
document.getElementById(id).style.display="block";
document.getElementById(id).classList.add("show");

document.getElementById("stepText").textContent="STEP "+step+" OF 4";

for(let i=1;i<=4;i++){
document.getElementById("dpaDot"+i).classList.remove("active");
}

document.getElementById("dpaDot"+step).classList.add("active");

if(step===2)setTimeout(()=>dpaValidateLead(),80);

if(step===3&&!qualificationSubmitted){
qIndex=0;
leadData.credit_answered=false;
leadData.income_answered=false;
leadData.employment_answered=false;
leadData.taxes_answered=false;
leadData.credit_640_plus=null;
leadData.income_70k_plus=null;
leadData.job_history_2yrs=null;
leadData.tax_returns_2yrs=null;
leadData.employment_history="";
leadData.tax_return_history="";
leadData.readiness_score=0;
leadData.route="";
leadData.results_url="";
leadData.submission_stage="Premium Readiness Started";
dpaRenderQuestion();
dpaUpdateScore();
updateHiddenPayload();
}
};

const p=parseInt(v,10);
leadData.home_price=p;
leadData.estimated_dpa=Math.round(p*.05);
leadData.submission_stage="Estimate Viewed";

document.getElementById("homePriceDisplay").textContent=fmt(p);
document.getElementById("dpaEstimate").textContent=fmt(p*.05);

updateHiddenPayload();
};

window.dpaValidateLead=function(){
leadData.first_name=document.getElementById("firstName").value.trim();
leadData.last_name=document.getElementById("lastName").value.trim();
leadData.email=document.getElementById("email").value.trim();
leadData.phone=document.getElementById("phone").value.replace(/\D/g,'');
leadData.submission_stage="Lead Info Entered";

const e=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(leadData.email);
const ph=leadData.phone.replace(/\D/g,"").length>=10;
const ready=!!(leadData.first_name&&leadData.last_name&&e&&ph);
const btn=document.getElementById("leadNextBtn");

btn.disabled=!ready;
btn.classList.toggle("ready",ready);

updateHiddenPayload();
};

window.dpaSaveLeadAndContinue=function(){
if(leadSubmitted){
dpaGoToStep(3);
return;
}

dpaValidateLead();

leadData.submission_stage="Lead Info Captured - Not Submitted Yet";
leadSubmitted=true;

document.getElementById("leadNextBtn").disabled=true;
document.getElementById("leadNextBtn").textContent="SAVED";

updateHiddenPayload();

setTimeout(()=>dpaGoToStep(3),300);
};

<input id="creditScoreSlider" class="dpa-range" type="range" min="580" max="800" step="1" value="${leadData.credit_score}" oninput="dpaUpdatePremiumCredit(this.value)">
<div class="dpa-range-labels"><span>580</span><span>690</span><span>800</span></div>
<button type="button" id="creditNextBtn" class="dpa-submit ready" onclick="dpaCreditNext()">CONTINUE</button>
</div>`;
}

if(q.type==="income"){
wrap.innerHTML=`
<div class="dpa-premium-panel">
<div class="dpa-premium-mini">${q.mini}</div>
<div class="dpa-premium-title">What is your household income?</div>
<div id="incomeDisplay" class="dpa-premium-value">${fmt(leadData.household_income)}</div>
<div class="dpa-premium-explain">Slide bar to your estimated household income.</div>
<input id="incomeSlider" class="dpa-range" type="range" min="60000" max="200000" step="1000" value="${leadData.household_income}" oninput="dpaUpdatePremiumIncome(this.value)">
<div class="dpa-range-labels"><span>$60K</span><span>$120K</span><span>$200K</span></div>
<button type="button" id="incomeNextBtn" class="dpa-submit ready" onclick="dpaIncomeNext()">CONTINUE</button>
</div>`;
}

if(q.type==="employment"){
wrap.innerHTML=`
<div class="dpa-premium-panel">
<div class="dpa-premium-mini">${q.mini}</div>
<div class="dpa-premium-title">Choose your employment history.</div>
<div class="dpa-premium-explain">Choose the best option that represents your last two years of employment.</div>
<div class="dpa-select-grid">
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'employed_2_years',true)"><div class="dpa-select-title">Employed past two years</div><div class="dpa-select-copy">I worked for the same employer for the past two years.</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'switched_jobs_2_years',true)"><div class="dpa-select-title">Switched jobs, but worked two years</div><div class="dpa-select-copy">I’ve had different jobs, but worked without large gaps of employment.</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'recent_college_graduate',true)"><div class="dpa-select-title">Just graduated college</div><div class="dpa-select-copy">School counts as work history as long as you graduated and began work within 6 months.</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'in_and_out_of_work',false)"><div class="dpa-select-title">In and out of work</div><div class="dpa-select-copy">This may need employment prep first.</div></button>
</div>
<button type="button" id="employmentNextBtn" class="dpa-submit" onclick="dpaPremiumNext()" disabled>CONTINUE</button>
</div>`;
}

if(q.type==="taxes"){
wrap.innerHTML=`
<div class="dpa-premium-panel">
<div class="dpa-premium-mini">${q.mini}</div>
<div class="dpa-premium-title">Choose your tax return history.</div>
<div class="dpa-select-grid">
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'filed_2_years',true)"><div class="dpa-select-title">Filed taxes for the last 2 years</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'filed_1_year',false)"><div class="dpa-select-title">Only filed 1 year</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'not_filed_recently',false)"><div class="dpa-select-title">Have not filed recently</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'not_sure',false)"><div class="dpa-select-title">Not sure</div></button>
</div>
<button type="button" id="taxesNextBtn" class="dpa-submit" onclick="dpaSubmitQualification()" disabled>GET MY RESULTS</button>
</div>`;
}

dpaUpdateScore();
updateHiddenPayload();
}

window.dpaUpdatePremiumCredit=function(v){
leadData.credit_score=parseInt(v,10);
const el=document.getElementById("creditScoreDisplay");

el.textContent=leadData.credit_score;
el.classList.toggle("dpa-premium-good",leadData.credit_score>=640);
el.classList.toggle("dpa-premium-warn",leadData.credit_score<640);

leadData.submission_stage="Credit Slider Updated";
updateHiddenPayload();
};

window.dpaUpdatePremiumIncome=function(v){
leadData.household_income=parseInt(v,10);
const el=document.getElementById("incomeDisplay");

el.textContent=fmt(leadData.household_income);
el.classList.toggle("dpa-premium-good",leadData.household_income>=70000);
el.classList.toggle("dpa-premium-warn",leadData.household_income<70000);

leadData.submission_stage="Income Slider Updated";
updateHiddenPayload();
};

window.dpaCreditNext=function(){
leadData.credit_answered=true;
leadData.credit_640_plus=leadData.credit_score>=640;
dpaPremiumNext();
};

window.dpaIncomeNext=function(){
leadData.income_answered=true;
leadData.income_70k_plus=leadData.household_income>=70000;
dpaPremiumNext();
};

window.dpaSelectEmployment=function(btn,value,pass){
leadData.employment_answered=true;
leadData.employment_history=value;
leadData.job_history_2yrs=pass;

document.querySelectorAll("#premiumQuestionWrap .dpa-select-card").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

const next=document.getElementById("employmentNextBtn");
next.disabled=false;
next.classList.add("ready");

leadData.submission_stage="Employment History Selected";
dpaUpdateScore();
};

window.dpaSelectTaxes=function(btn,value,pass){
leadData.taxes_answered=true;
leadData.tax_return_history=value;
leadData.tax_returns_2yrs=pass;

document.querySelectorAll("#premiumQuestionWrap .dpa-select-card").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

const next=document.getElementById("taxesNextBtn");
next.disabled=false;
next.classList.add("ready");

leadData.submission_stage="Tax Return History Selected";
dpaUpdateScore();
};

window.dpaPremiumNext=function(){
const q=questions[qIndex];
leadData.submission_stage=q.mini+" Completed";
dpaUpdateScore();

if(qIndex<questions.length-1){
qIndex++;
dpaRenderQuestion();
}else{
dpaSubmitQualification();
}
};

window.dpaSubmitQualification=async function(){
if(qualificationSubmitted)return;

calculateScore();
const destination=buildResultsUrl();

qualificationSubmitted=true;
leadData.final_submitted=true;
leadData.final_submitted_at=new Date().toISOString();
leadData.submission_stage=leadData.readiness_score===100?"Submit Final - Qualification Qualified":"Submit Final - Redirected To Results Page";

document.getElementById("finalScoreNum").textContent=leadData.readiness_score+"%";
document.getElementById("finalScoreFill").style.width=leadData.readiness_score+"%";
document.getElementById("finalScoreStatus").textContent=leadData.readiness_score===100?"Strong Match":"Routing";

updateHiddenPayload();

dpaGoToStep(4);
document.getElementById("finalTitle").textContent="Saving your personal plan...";
document.getElementById("resultsIntro").textContent="We’re creating your secure PrepHub login and emailing your next steps.";

try{
await sendPrepHubIntake("qualification_final");
}catch(error){
qualificationSubmitted=false;
document.getElementById("finalTitle").textContent="We couldn’t save your plan yet.";
document.getElementById("resultsIntro").textContent=(error&&error.message?error.message:"Please try again.")+" Return to the last question and tap GET MY RESULTS again.";
return;
}

if(leadData.readiness_score===100){
document.getElementById("finalTitle").textContent="You’re 100% ready.";
document.getElementById("resultsIntro").textContent="Your credit, income, employment, and tax history look ready. Your DPA Help Center login link is in your email.";
document.getElementById("beginAppBtn").style.display="block";
document.getElementById("agentBtn").style.display="block";
}else{
document.getElementById("finalTitle").textContent="Sending you to your prep hub...";
document.getElementById("resultsIntro").textContent="Your plan is saved. Check your email for your secure PrepHub login.";
setTimeout(()=>{window.top.location.href=destination},900);
}
};

function dpaUpdateScore(){
const s=calculateScore();

document.getElementById("readinessScore").textContent=s+"%";
document.getElementById("readinessFill").style.width=s+"%";
document.getElementById("readinessStatus").textContent=s===100?"Strong Match":s===75?"Almost Ready":s===50?"Needs Review":s>0?"Needs Help First":"Start with credit";

updateHiddenPayload();
}

window.dpaStartApplication=function(){
leadData.route="application_started";
leadData.submission_stage="Application Started";
leadData.final_submitted=true;
leadData.final_submitted_at=new Date().toISOString();

sendPrepHubIntake("application_started").catch(function(error){console.log(error)});

setTimeout(()=>{window.top.location.href=APPLICATION_URL},500);
};

document.getElementById("homePriceDisplay").textContent=fmt(leadData.home_price);
document.getElementById("dpaEstimate").textContent=fmt(leadData.estimated_dpa);
updateHiddenPayload();
}
})();
</script>
</div>
</body>
</html>
