<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPA Help Center | Down Payment Assistance</title>
<meta name="description" content="Check your homebuyer readiness and explore down payment assistance options.">
<style>html,body{margin:0;min-height:100%;background:#fff}</style>
<link rel="stylesheet" href="/assets/dpa-design.css?v=20260930-slash">
</head>
<body>
<div id="dpa-desktop-funnel">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
html,body{margin:0;padding:0;background:#fff;overflow-x:hidden!important;scrollbar-width:none!important;-ms-overflow-style:none!important}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}

#dpa-desktop-funnel{
width:100%;
max-width:1180px;
min-width:980px;
margin:0 auto;
padding:24px 20px 40px;
background:#fff;
font-family:Inter,Arial,sans-serif;
color:#081F5C;
box-sizing:border-box;
overflow:hidden!important;
}

#dpa-desktop-funnel *{box-sizing:border-box;font-family:Inter,Arial,sans-serif}

.dpa-grid{
display:grid;
grid-template-columns:560px 430px;
gap:34px;
justify-content:center;
align-items:start;
}

.dpa-left{padding-top:4px}
.dpa-right-wrap{width:430px}

.dpa-brand{
font-size:36px;
font-weight:950;
letter-spacing:-1px;
color:#081F5C;
margin:0 0 16px;
white-space:nowrap;
}

.dpa-brand:after{
content:"";
display:block;
width:145px;
height:7px;
background:#D22630;
border-radius:999px;
margin:5px 0 0 58px;
transform:rotate(-2deg);
}

.dpa-left-kicker,.dpa-kicker{
font-size:12px;
font-weight:900;
letter-spacing:5px;
color:#0057B8;
text-transform:uppercase;
margin-bottom:14px;
}

.dpa-left-title{
font-size:58px;
font-weight:900;
line-height:.92;
letter-spacing:-4px;
color:#081F5C;
margin:0 0 20px;
}

.dpa-left-title span,.red,.dpa-red{color:#D22630}

.dpa-left-sub{
max-width:520px;
font-size:18px;
font-weight:750;
line-height:1.4;
color:#5f6b7f;
margin-bottom:14px;
}

.dpa-home-phone{
display:inline-block;
margin:0 0 24px;
color:#081F5C;
font-size:18px;
font-weight:900;
text-decoration:none;
}

.dpa-home-phone span{color:inherit}

.dpa-benefit-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
max-width:520px;
}

.dpa-benefit-pill{
border-radius:17px;
background:#fff;
padding:14px 15px;
font-size:13px;
font-weight:850;
color:#081F5C;
box-shadow:0 8px 22px rgba(8,31,92,.06);
}

.dpa-benefit-pill span{color:#0057B8;font-weight:900}

.dpa-card{
width:100%;
min-height:580px;
padding:12px 0 24px;
text-align:center;
overflow:visible;
}
  
.dpa-right-trust{
display:flex;
align-items:center;
justify-content:center;
gap:14px;
margin:0 auto 16px;
width:100%;
text-align:center;
}

.dpa-face-stack{width:166px;height:42px;position:relative;flex:0 0 166px}

.dpa-face{
width:42px;
height:42px;
border-radius:50%;
position:absolute;
top:0;
border:3px solid #fff;
overflow:hidden;
opacity:1;
transform:scale(1);
background:#eef3ff;
box-shadow:0 8px 14px rgba(8,31,92,.08);
transition:opacity .35s ease,transform .35s ease;
}

.dpa-face.fade{opacity:0;transform:scale(.84)}
.dpa-face img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(.98)}
.dpa-face:nth-child(1){left:0}
.dpa-face:nth-child(2){left:31px}
.dpa-face:nth-child(3){left:62px}
.dpa-face:nth-child(4){left:93px}
.dpa-face:nth-child(5){left:124px}

.dpa-trust-copy{
font-size:18px;
font-weight:750;
line-height:1.08;
color:#6f7890;
text-align:left;
white-space:nowrap;
}

.dpa-trust-copy strong{color:#081F5C;font-weight:950}
.dpa-stars{margin-top:7px;color:#F5B301;font-size:21px;letter-spacing:2px}

.dpa-program-top,.dpa-premium-panel,.dpa-score-top,.dpa-estimate-card,.dpa-benefit,.dpa-select-card{
background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,255,255,.70));
border:1px solid rgba(8,31,92,.08);
box-shadow:0 12px 30px rgba(8,31,92,.06);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
}

.dpa-program-top{margin:0 auto 18px;padding:16px 15px;border-radius:24px;max-width:380px}
.dpa-program-label{font-size:10px;font-weight:900;letter-spacing:4px;color:#081F5C;margin-bottom:8px}
.dpa-program-line{height:1px;background:linear-gradient(90deg,transparent,rgba(8,31,92,.22),transparent)}
.dpa-program-number{font-size:66px;font-weight:900;letter-spacing:-5px;line-height:.95;color:#081F5C;margin:10px 0;transition:.25s ease;white-space:nowrap}
.dpa-program-number.flash{transform:scale(1.035)}
.dpa-program-copy{margin-top:10px;font-size:14px;font-weight:850;line-height:1.18;color:#081F5C}

.dpa-step-screen{display:none;animation:dpaFade .22s ease}
.dpa-step-screen.show{display:block}
@keyframes dpaFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.dpa-question-kicker{font-size:10px;font-weight:900;letter-spacing:3.5px;color:#0057B8;margin:0 0 8px;text-transform:uppercase}
.dpa-question{font-size:24px;font-weight:900;line-height:1.08;color:#081F5C;margin:0 auto 10px;max-width:330px;letter-spacing:-.6px}
#screenThree .dpa-question{font-size:clamp(36px,5vw,46px);max-width:450px;line-height:1;letter-spacing:-1.8px;margin-bottom:20px}
.dpa-note{max-width:320px;margin:0 auto 14px;font-size:10.5px;font-weight:700;line-height:1.35;color:#7c8496}

.dpa-btns{display:flex;flex-direction:column;gap:10px;margin:0 auto 14px;max-width:330px}

.dpa-choice,.dpa-submit,.dpa-answer-btn{
width:100%;
min-height:52px;
border-radius:18px;
border:1.5px solid rgba(8,31,92,.12);
background:#fff;
color:#081F5C;
font-size:14px;
font-weight:900;
letter-spacing:1px;
cursor:pointer;
box-shadow:0 8px 22px rgba(8,31,92,.04);
transition:.22s ease;
}

.dpa-choice{height:48px;min-height:48px;font-size:15px;letter-spacing:5px}

.dpa-choice:hover,.dpa-submit:hover,.dpa-select-card:hover{
transform:translateY(-3px);
border-color:rgba(0,87,184,.50);
box-shadow:0 15px 35px rgba(8,31,92,.12);
}

.dpa-submit.ready{background:#081F5C!important;color:#fff!important;border-color:#081F5C!important;box-shadow:0 14px 30px rgba(8,31,92,.22)!important}
.dpa-submit:disabled{opacity:.38;cursor:not-allowed}

.dpa-location-box{display:none;margin:12px auto 16px;animation:dpaFade .2s ease;max-width:340px}
.dpa-location-box.show{display:block}
.dpa-location-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px auto 12px}

.dpa-field{
width:100%;
height:44px;
border-radius:14px;
border:1px solid rgba(8,31,92,.14);
background:#fff;
padding:0 12px;
color:#081F5C;
font-size:12px;
font-weight:800;
outline:none;
}

.dpa-field:focus{border-color:rgba(0,87,184,.58);box-shadow:0 10px 22px rgba(8,31,92,.08)}

.dpa-slider-title{font-size:24px;font-weight:900;color:#081F5C;line-height:1.12;margin:4px 0 8px}
.dpa-slider-sub{font-size:11px;font-weight:750;color:#6f7890;line-height:1.35;max-width:330px;margin:0 auto 12px}
.dpa-price{font-size:36px;font-weight:900;letter-spacing:-2px;color:#081F5C;margin:0 0 12px}

.dpa-range{
width:100%;
appearance:none;
-webkit-appearance:none;
height:8px;
border-radius:999px;
background:linear-gradient(90deg,#9fc5ff,#081F5C);
outline:none;
}

.dpa-range::-webkit-slider-thumb{
appearance:none;
-webkit-appearance:none;
width:24px;
height:24px;
border-radius:50%;
background:#081F5C;
border:3px solid #fff;
}

.dpa-range-labels{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#081F5C;margin:8px 12px 12px}
.dpa-estimate-card{margin:12px auto;padding:10px;border-radius:16px;max-width:340px}
.dpa-estimate-label{font-size:8px;font-weight:900;letter-spacing:1.3px;color:#0057B8}
.dpa-estimate-num{font-size:30px;font-weight:900;color:#081F5C;letter-spacing:-1px;margin-top:4px}

.dpa-benefits{display:grid;gap:5px;margin:0 auto 10px;max-width:315px;text-align:left}
.dpa-benefit{font-size:9.5px;font-weight:800;color:#081F5C;border-radius:11px;padding:6px 9px}
.dpa-benefit span{color:#0057B8;font-weight:900}

.dpa-fields{display:flex;flex-direction:column;gap:8px;margin:10px auto 0;max-width:330px}

.dpa-score-top{padding:11px;border-radius:18px;margin:9px auto 12px;max-width:350px}
.dpa-score-label{font-size:8px;font-weight:900;letter-spacing:2px;color:#0057B8}
.dpa-score-num{font-size:34px;font-weight:900;color:#081F5C;letter-spacing:-1px;margin:2px 0}
.dpa-score-status{font-size:10.5px;font-weight:900;color:#D22630}
.dpa-score-bar{height:7px;border-radius:999px;background:rgba(8,31,92,.12);overflow:hidden;margin-top:8px}
.dpa-score-fill{height:100%;width:0%;border-radius:999px;background:#081F5C;transition:.25s ease}

.dpa-premium-panel{border-radius:20px;padding:14px 12px;margin:10px auto 12px;max-width:360px}
.dpa-premium-mini{font-size:8px;font-weight:900;letter-spacing:2.2px;color:#0057B8;margin-bottom:7px}
.dpa-premium-title{font-size:20px;font-weight:900;line-height:1.08;color:#081F5C;margin-bottom:8px}
.dpa-premium-value{font-size:34px;font-weight:900;letter-spacing:-1px;color:#081F5C;margin-bottom:8px}
.dpa-premium-explain{font-size:10px;font-weight:750;color:#6f7890;line-height:1.35;max-width:290px;margin:0 auto 12px}
.dpa-premium-good{color:#0057B8!important}
.dpa-premium-warn{color:#D22630!important}

.dpa-select-grid{display:grid;gap:8px;margin-top:10px}
.dpa-select-card{width:100%;border-radius:16px;padding:12px;text-align:left;color:#081F5C;cursor:pointer;transition:.22s ease}
.dpa-select-card.active{background:#081F5C!important;color:#fff!important;border-color:#081F5C!important;box-shadow:0 12px 28px rgba(8,31,92,.22)!important}
.dpa-select-card.active .dpa-select-title,.dpa-select-card.active .dpa-select-copy{color:#fff!important}
.dpa-select-title{font-size:11.5px;font-weight:950;line-height:1.15}
.dpa-select-copy{font-size:9px;font-weight:750;color:#6f7890;line-height:1.28;margin-top:4px}

.dpa-final-btn,.dpa-agent-btn,.dpa-link-btn{
display:block;
width:100%;
border:none;
text-align:center;
text-decoration:none;
border-radius:14px;
color:#fff;
font-size:11px;
font-weight:900;
letter-spacing:.6px;
padding:13px 8px;
box-shadow:0 10px 20px rgba(8,31,92,.14);
cursor:pointer;
}

.dpa-final-btn,.dpa-link-btn.red{background:#D22630;margin-top:10px}
.dpa-agent-btn{
background:#eef3ff;
color:#081F5C;
border:2px solid #081F5C;
margin-top:8px;
}
.dpa-link-btn.blue{background:#081F5C;margin-top:8px}
.dpa-route-title{font-size:22px;font-weight:900;line-height:1.12;color:#081F5C;margin:10px 0 8px}
.dpa-route-copy{font-size:10.5px;font-weight:750;line-height:1.4;color:#6f7890;margin:0 auto 12px;max-width:300px}

.dpa-footer{margin-top:12px;padding-bottom:8px}
.dpa-step{font-size:10.5px;font-weight:900;letter-spacing:3px;color:#081F5C;margin-bottom:7px}
.dpa-progress-dots{display:flex;justify-content:center;gap:7px}
.dpa-dot{width:6px;height:6px;border-radius:50%;background:rgba(8,31,92,.16)}
.dpa-dot.active{width:18px;border-radius:999px;background:#081F5C}

.page-wrap{width:100%;max-width:980px;margin:0 auto;text-align:center;overflow:hidden}
.page-brand{font-size:34px;font-weight:950;color:#081F5C;margin:4px 0}
.page-brand:after{content:"";display:block;width:140px;height:7px;background:#D22630;border-radius:999px;margin:5px auto 18px;transform:rotate(-2deg)}
.page-title{font-size:46px;font-weight:950;letter-spacing:-2.5px;line-height:.96;color:#081F5C;margin:0 0 12px}
.page-title span{color:#D22630}
.page-sub{max-width:780px;margin:0 auto 24px;font-size:15px;font-weight:750;line-height:1.45;color:#5f6b7f}

.page-card{
border:1px solid rgba(8,31,92,.08);
border-radius:26px;
background:#fff;
box-shadow:0 18px 42px rgba(8,31,92,.06);
padding:22px;
text-align:left;
}

.page-grid,.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.page-field label{display:block;font-size:11px;font-weight:900;color:#081F5C;margin-bottom:6px}
.page-field small{display:block;font-size:9.5px;font-weight:750;color:#7c8496;margin-bottom:6px}
.page-input,.page-select{width:100%;height:48px;border-radius:15px;border:1px solid rgba(8,31,92,.14);background:#fff;color:#081F5C;padding:0 14px;font-size:14px;font-weight:850;outline:none}
.page-btn{width:100%;min-height:56px;border:none;border-radius:17px;background:#081F5C;color:#fff;font-size:14px;font-weight:950;letter-spacing:.5px;margin-top:18px;cursor:pointer}
.page-result{display:none;margin-top:18px;border-radius:22px;background:#081F5C;color:#fff;padding:20px;text-align:center}
.page-result.show{display:block}
.page-result-num{font-size:44px;font-weight:950;letter-spacing:-2px;margin:5px 0}

.results-save{width:100%;max-width:360px;margin:18px auto 24px;background:#081F5C;color:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 38px rgba(8,31,92,.2)}
.results-save h3{font-size:31px;line-height:.95;letter-spacing:-1px;margin:8px 0}

.result-card{
position:relative;
overflow:hidden;
border-radius:22px;
border:1px solid rgba(8,31,92,.09);
background:#fff;
padding:18px;
box-shadow:0 14px 30px rgba(8,31,92,.06);
opacity:.45;
}

.result-card.active{
opacity:1;
border:2px solid #D22630;
box-shadow:0 0 0 3px rgba(210,38,48,.16),0 0 26px rgba(210,38,48,.42),0 18px 34px rgba(210,38,48,.14);
animation:glowBorder 1.45s ease-in-out infinite;
}

@keyframes glowBorder{
0%,100%{box-shadow:0 0 0 3px rgba(210,38,48,.13),0 0 18px rgba(210,38,48,.35),0 18px 34px rgba(210,38,48,.12)}
50%{box-shadow:0 0 0 6px rgba(210,38,48,.24),0 0 36px rgba(210,38,48,.72),0 22px 42px rgba(210,38,48,.20)}
}

.result-top{font-size:8px;font-weight:900;letter-spacing:2.4px;text-transform:uppercase;color:#D22630;margin-bottom:8px}
.result-status{display:inline-block;border-radius:999px;background:rgba(210,38,48,.08);color:#D22630;font-size:9px;font-weight:950;padding:6px 9px;margin-bottom:10px}
.result-card h3{font-size:24px;line-height:1.02;letter-spacing:-.8px;font-weight:950;margin:0 0 8px;color:#081F5C}
.result-card p{font-size:12px;font-weight:720;line-height:1.42;color:#5f6b7f;margin:0 0 12px}
.result-btn{display:grid;place-items:center;width:100%;min-height:50px;margin-top:12px;border-radius:15px;background:#081F5C;color:#fff;text-decoration:none;font-size:11.5px;font-weight:950;text-align:center}
.result-card.active .result-btn{background:#D22630}
.result-return{display:block;text-align:center;margin-top:8px;color:#081F5C;font-size:9.5px;font-weight:900;text-decoration:none}
.results-note{margin-top:16px;border-radius:16px;background:rgba(210,38,48,.055);border:1px solid rgba(210,38,48,.1);padding:14px;font-size:11.5px;font-weight:800;line-height:1.4;color:#081F5C;text-align:left}

#leadNextBtn{
width:240px;
height:36px;
min-height:50px;
display:block;
margin:10px auto 0;
border-radius:16px;
}
#employmentNextBtn{
    margin-top:10px;
}

#taxesNextBtn{
    margin-top:10px;
}

/* Responsive layout for the directly hosted site. The original funnel was
   designed inside a wide Wix embed, so the standalone page must remove those
   desktop-only dimensions before it reaches a phone-sized viewport. */
@media (max-width:1100px){
  #dpa-desktop-funnel{min-width:0;max-width:100%}
  .dpa-grid{grid-template-columns:minmax(0,1fr) 400px;gap:24px}
  .dpa-left-title{font-size:48px;letter-spacing:-3px}
}

@media (max-width:850px){
  html,body{width:100%;min-width:0}

  #dpa-desktop-funnel{
    width:100%;
    min-width:0;
    padding:18px 16px 32px;
    overflow:visible!important;
  }

  .dpa-grid{display:block;width:100%}
  .dpa-left{width:100%;padding:0;text-align:center}

  .dpa-right-wrap{
    width:100%;
    max-width:460px;
    margin:26px auto 0;
  }

  .dpa-brand{
    font-size:29px;
    letter-spacing:-.7px;
    margin-bottom:14px;
    white-space:normal;
  }

  .dpa-brand:after{width:122px;height:6px;margin:5px auto 0}

  .dpa-left-kicker,.dpa-kicker{
    font-size:10px;
    letter-spacing:3.4px;
    margin-bottom:11px;
  }

  .dpa-left-title{
    max-width:620px;
    margin:0 auto 16px;
    font-size:42px;
    line-height:.98;
    letter-spacing:-2.5px;
  }

  .dpa-left-sub{
    max-width:560px;
    margin:0 auto 12px;
    font-size:16px;
    line-height:1.42;
  }

  .dpa-home-phone{margin-bottom:20px;font-size:17px}

  .dpa-benefit-grid{
    max-width:560px;
    margin:0 auto;
    text-align:left;
  }

  .dpa-card{min-height:0;padding:4px 0 20px}
  .page-wrap{max-width:700px}
  .page-grid,.results-grid{grid-template-columns:1fr}
}

@media (max-width:520px){
  #dpa-desktop-funnel{padding:14px 14px 26px}
  .dpa-brand{font-size:26px}

  .dpa-left-title{
    font-size:34px;
    line-height:1;
    letter-spacing:-1.8px;
  }

  .dpa-left-sub{font-size:14px}

  .dpa-benefit-grid{
    grid-template-columns:1fr;
    gap:8px;
  }

  .dpa-benefit-pill{
    padding:12px 13px;
    font-size:12px;
    border:1px solid rgba(8,31,92,.06);
  }

  .dpa-right-wrap{margin-top:22px}
  .dpa-right-trust{gap:8px;margin-bottom:13px}

  .dpa-face-stack{width:146px;height:38px;flex-basis:146px}
  .dpa-face{width:38px;height:38px}
  .dpa-face:nth-child(2){left:27px}
  .dpa-face:nth-child(3){left:54px}
  .dpa-face:nth-child(4){left:81px}
  .dpa-face:nth-child(5){left:108px}

  .dpa-trust-copy{font-size:14px;white-space:normal}
  .dpa-stars{margin-top:5px;font-size:17px}

  .dpa-program-top{
    max-width:100%;
    margin-bottom:16px;
    padding:14px 12px;
  }

  .dpa-program-number{font-size:56px}
  .dpa-question{font-size:23px}

  .dpa-btns,.dpa-fields,.dpa-location-box,
  .dpa-estimate-card,.dpa-score-top,.dpa-premium-panel{max-width:100%}

  .dpa-location-grid{grid-template-columns:1fr}
  .dpa-choice,.dpa-submit,.dpa-answer-btn{min-height:54px}
  #leadNextBtn{width:100%;min-height:54px}

  .page-brand{font-size:28px}
  .page-title{font-size:34px;line-height:1;letter-spacing:-1.5px}
  .page-sub{font-size:13px;margin-bottom:18px}
  .page-card{padding:16px;border-radius:20px}
  .results-save{max-width:100%;padding:18px}
  .results-save h3{font-size:27px}
  .result-card{padding:16px}
  .result-card h3{font-size:22px}

  .dpa-choice:hover,.dpa-submit:hover,.dpa-select-card:hover{transform:none}
}

/* Georgia-first homepage presentation. Existing funnel controls and IDs are
   intentionally retained so lead scoring, routing, email, CRM, and call logic
   continue to use the same code paths. */
#dpa-desktop-funnel.ga-mode{max-width:none;min-width:0;padding:0;background:#fff}

let audioReady=false;
let audioCtx=null;

function dpaSound(freq=520,type="sine",dur=.06,gain=.025){
try{
audioReady=true;
audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();
o.type=type;
o.frequency.value=freq;
g.gain.value=gain;
o.connect(g);
g.connect(audioCtx.destination);
o.start();
g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
o.stop(audioCtx.currentTime+dur);
}catch(e){}
}

window.calculateDTI=function(){
const clean=v=>Number(String(v||"").replace(/[^0-9.]/g,""))||0;
const income=clean(document.getElementById("income").value);
const debts=clean(document.getElementById("debts").value);
const payment=clean(document.getElementById("payment").value);
const support=clean(document.getElementById("support").value);
const box=document.getElementById("dtiResults");
const num=document.getElementById("dtiNumber");
const copy=document.getElementById("dtiCopy");

box.classList.add("show");

if(income<=0){
num.textContent="0%";
copy.textContent="Enter your monthly income to calculate your debt-to-income estimate.";
return;
}

const dti=Math.round(((debts+payment+support)/income)*100);
num.textContent=dti+"%";

copy.textContent=dti<=43
?"This looks stronger. Your estimated DTI may be within a workable range for many loan programs."
:dti<=57
?"This may need lender review. Some programs may allow higher DTI, but your full file must be reviewed."
:"This looks high. Reducing monthly debts may improve your buying power before moving forward.";
};

function buildItemName(){
const n=((leadData.first_name||"")+" "+(leadData.last_name||"")).trim();
return n||leadData.email||leadData.phone||(leadData.city&&leadData.zip?"DPA Lead - "+leadData.city+" "+leadData.zip:"DPA Lead - "+leadData.lead_id);

function calculateScore(){
let s=0;
if(leadData.credit_answered&&leadData.credit_score>=640)s+=25;
if(leadData.income_answered&&leadData.household_income>=70000)s+=25;
if(leadData.employment_answered&&leadData.job_history_2yrs===true)s+=25;
if(leadData.taxes_answered&&leadData.tax_returns_2yrs===true)s+=25;

leadData.credit_640_plus=leadData.credit_answered?leadData.credit_score>=640:null;
leadData.income_70k_plus=leadData.income_answered?leadData.household_income>=70000:null;
leadData.readiness_score=s;
return s;
}

function buildDeficiencyList(){
let a=[];
if(leadData.credit_640_plus===false)a.push({key:"credit",param:"credit=1",url:CREDIT_URL});
if(leadData.income_70k_plus===false)a.push({key:"dti",param:"dti=1",url:DTI_URL});
if(leadData.job_history_2yrs===false)a.push({key:"job",param:"job=1",url:JOB_URL});
if(leadData.tax_returns_2yrs===false)a.push({key:"taxes",param:"taxes=1",url:TAXES_URL});
return a;
}

function buildResultsUrl(){
const d=buildDeficiencyList();

if(d.length===0){
leadData.route="qualified_begin_application";
leadData.results_url=APPLICATION_URL;
return APPLICATION_URL;
}

leadData.route=d.map(i=>i.key+"_review").join("|");
const q=d.map(i=>i.param).join("&");
leadData.results_url=PREPHUB_URL+"?"+q+"&score="+encodeURIComponent(leadData.readiness_score)+"&route="+encodeURIComponent(leadData.route)+"&lead="+encodeURIComponent(leadData.lead_id);
return leadData.results_url;
}

async function sendPrepHubIntake(t){
leadData.submit_type=t;
const p=makePayload();
document.getElementById("leadPayloadField").value=JSON.stringify(p);

const response=await fetch(PREPHUB_INTAKE_URL,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_PUBLISHABLE_KEY,
"Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY
},
body:JSON.stringify(p),
keepalive:true
});

const result=await response.json().catch(()=>({}));
if(!response.ok)throw new Error(result.error||"PrepHub could not save your plan.");
localStorage.setItem("dpa_prephub_email",leadData.email);
localStorage.setItem("dpa_prephub_lead_id",leadData.lead_id);
localStorage.setItem("dpa_prephub_score",String(leadData.readiness_score));
localStorage.setItem("dpa_prephub_first_name",leadData.first_name);
return result;
}

<input id="creditScoreSlider" class="dpa-range" type="range" min="580" max="800" step="1" value="${leadData.credit_score}" oninput="dpaUpdatePremiumCredit(this.value)">
<div class="dpa-range-labels"><span>580</span><span>690</span><span>800</span></div>
<button type="button" id="creditNextBtn" class="dpa-submit ready" onclick="dpaCreditNext()">CONTINUE</button>
</div>`;
}

if(q.type==="income"){
wrap.innerHTML=`
<div class="dpa-premium-panel">
<div class="dpa-premium-mini">${q.mini}</div>
<div class="dpa-premium-title">What is your household income?</div>
<div id="incomeDisplay" class="dpa-premium-value">${fmt(leadData.household_income)}</div>
<div class="dpa-premium-explain">Slide bar to your estimated household income.</div>
<input id="incomeSlider" class="dpa-range" type="range" min="60000" max="200000" step="1000" value="${leadData.household_income}" oninput="dpaUpdatePremiumIncome(this.value)">
<div class="dpa-range-labels"><span>$60K</span><span>$120K</span><span>$200K</span></div>
<button type="button" id="incomeNextBtn" class="dpa-submit ready" onclick="dpaIncomeNext()">CONTINUE</button>
</div>`;
}

if(q.type==="employment"){
wrap.innerHTML=`
<div class="dpa-premium-panel">
<div class="dpa-premium-mini">${q.mini}</div>
<div class="dpa-premium-title">Choose your employment history.</div>
<div class="dpa-premium-explain">Choose the best option that represents your last two years of employment.</div>
<div class="dpa-select-grid">
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'employed_2_years',true)"><div class="dpa-select-title">Employed past two years</div><div class="dpa-select-copy">I worked for the same employer for the past two years.</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'switched_jobs_2_years',true)"><div class="dpa-select-title">Switched jobs, but worked two years</div><div class="dpa-select-copy">I’ve had different jobs, but worked without large gaps of employment.</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'recent_college_graduate',true)"><div class="dpa-select-title">Just graduated college</div><div class="dpa-select-copy">School counts as work history as long as you graduated and began work within 6 months.</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectEmployment(this,'in_and_out_of_work',false)"><div class="dpa-select-title">In and out of work</div><div class="dpa-select-copy">This may need employment prep first.</div></button>
</div>
<button type="button" id="employmentNextBtn" class="dpa-submit" onclick="dpaPremiumNext()" disabled>CONTINUE</button>
</div>`;
}

if(q.type==="taxes"){
wrap.innerHTML=`
<div class="dpa-premium-panel">
<div class="dpa-premium-mini">${q.mini}</div>
<div class="dpa-premium-title">Choose your tax return history.</div>
<div class="dpa-select-grid">
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'filed_2_years',true)"><div class="dpa-select-title">Filed taxes for the last 2 years</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'filed_1_year',false)"><div class="dpa-select-title">Only filed 1 year</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'not_filed_recently',false)"><div class="dpa-select-title">Have not filed recently</div></button>
<button type="button" class="dpa-select-card" onclick="dpaSelectTaxes(this,'not_sure',false)"><div class="dpa-select-title">Not sure</div></button>
</div>
<button type="button" id="taxesNextBtn" class="dpa-submit" onclick="dpaSubmitQualification()" disabled>GET MY RESULTS</button>
</div>`;
}

dpaUpdateScore();
updateHiddenPayload();
}

window.dpaUpdatePremiumCredit=function(v){
leadData.credit_score=parseInt(v,10);
const el=document.getElementById("creditScoreDisplay");

el.textContent=leadData.credit_score;
el.classList.toggle("dpa-premium-good",leadData.credit_score>=640);
el.classList.toggle("dpa-premium-warn",leadData.credit_score<640);

leadData.submission_stage="Credit Slider Updated";
updateHiddenPayload();
};

window.dpaUpdatePremiumIncome=function(v){
leadData.household_income=parseInt(v,10);
const el=document.getElementById("incomeDisplay");

el.textContent=fmt(leadData.household_income);
el.classList.toggle("dpa-premium-good",leadData.household_income>=70000);
el.classList.toggle("dpa-premium-warn",leadData.household_income<70000);

leadData.submission_stage="Income Slider Updated";
updateHiddenPayload();
};

window.dpaCreditNext=function(){
leadData.credit_answered=true;
leadData.credit_640_plus=leadData.credit_score>=640;
dpaPremiumNext();
};

window.dpaIncomeNext=function(){
leadData.income_answered=true;
leadData.income_70k_plus=leadData.household_income>=70000;
dpaPremiumNext();
};

window.dpaSelectEmployment=function(btn,value,pass){
leadData.employment_answered=true;
leadData.employment_history=value;
leadData.job_history_2yrs=pass;

document.querySelectorAll("#premiumQuestionWrap .dpa-select-card").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

const next=document.getElementById("employmentNextBtn");
next.disabled=false;
next.classList.add("ready");

leadData.submission_stage="Employment History Selected";
dpaUpdateScore();
};

window.dpaSelectTaxes=function(btn,value,pass){
leadData.taxes_answered=true;
leadData.tax_return_history=value;
leadData.tax_returns_2yrs=pass;

document.querySelectorAll("#premiumQuestionWrap .dpa-select-card").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

const next=document.getElementById("taxesNextBtn");
next.disabled=false;
next.classList.add("ready");

leadData.submission_stage="Tax Return History Selected";
dpaUpdateScore();
};

window.dpaPremiumNext=function(){
const q=questions[qIndex];
leadData.submission_stage=q.mini+" Completed";
dpaUpdateScore();

if(qIndex<questions.length-1){
qIndex++;
dpaRenderQuestion();
}else{
dpaSubmitQualification();
}
};

window.dpaSubmitQualification=async function(){
if(qualificationSubmitted)return;

calculateScore();
const destination=buildResultsUrl();

qualificationSubmitted=true;
leadData.final_submitted=true;
leadData.final_submitted_at=new Date().toISOString();
leadData.submission_stage=leadData.readiness_score===100?"Submit Final - Qualification Qualified":"Submit Final - Redirected To Results Page";

document.getElementById("finalScoreNum").textContent=leadData.readiness_score+"%";
document.getElementById("finalScoreFill").style.width=leadData.readiness_score+"%";
document.getElementById("finalScoreStatus").textContent=leadData.readiness_score===100?"Strong Match":"Routing";

updateHiddenPayload();

dpaGoToStep(4);
document.getElementById("finalTitle").textContent="Saving your personal plan...";
document.getElementById("resultsIntro").textContent="We’re creating your secure PrepHub login and emailing your next steps.";

let intakeResult={};
try{
intakeResult=await sendPrepHubIntake("qualification_final");
}catch(error){
qualificationSubmitted=false;
document.getElementById("finalTitle").textContent="We couldn’t save your plan yet.";
document.getElementById("resultsIntro").textContent=(error&&error.message?error.message:"Please try again.")+" Return to the last question and tap GET MY RESULTS again.";
return;
}

if(leadData.readiness_score===100){
document.getElementById("finalTitle").textContent="You’re 100% ready.";
document.getElementById("resultsIntro").textContent=intakeResult.email_sent
?"Your credit, income, employment, and tax history look ready. Your DPA Help Center login link is in your email."
:"Your credit, income, employment, and tax history look ready. Your plan is saved—continue below while your login email becomes available.";
document.getElementById("beginAppBtn").style.display="block";
document.getElementById("agentBtn").style.display="block";
}else{
document.getElementById("finalTitle").textContent="Sending you to your prep hub...";
document.getElementById("resultsIntro").textContent=intakeResult.email_sent
?"Your plan is saved. Check your email for your secure PrepHub login."
:"Your plan is saved. Continue to PrepHub now; you can request a secure login link there.";
setTimeout(()=>{window.top.location.href=destination},900);
}
};

function dpaUpdateScore(){
const s=calculateScore();

document.getElementById("readinessScore").textContent=s+"%";
document.getElementById("readinessFill").style.width=s+"%";
document.getElementById("readinessStatus").textContent=s===100?"Strong Match":s===75?"Almost Ready":s===50?"Needs Review":s>0?"Needs Help First":"Start with credit";

updateHiddenPayload();
}

window.dpaStartApplication=function(){
leadData.route="application_started";
leadData.submission_stage="Application Started";
leadData.final_submitted=true;
leadData.final_submitted_at=new Date().toISOString();

sendPrepHubIntake("application_started").catch(function(error){console.log(error)});

setTimeout(()=>{window.top.location.href=APPLICATION_URL},500);
};

document.getElementById("homePriceDisplay").textContent=fmt(leadData.home_price);
document.getElementById("dpaEstimate").textContent=fmt(leadData.estimated_dpa);
updateHiddenPayload();
}
})();
</script>
</div>
</body>
</html>
