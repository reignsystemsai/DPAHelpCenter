<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Your next step | DPA Help Center</title><style>body{margin:0;background:#eef2f8;color:#081f5c;font:16px Arial,sans-serif;padding:32px 18px}main{max-width:480px;margin:8vh auto;background:white;padding:32px;border-radius:18px}h2{font-size:17px;letter-spacing:1px}h1{font-size:28px}p{line-height:1.7;color:#52617c}button{padding:14px 22px;background:#c8102e;color:white;border:0;border-radius:8px;font:700 15px Arial;cursor:pointer}button:disabled{opacity:.6}a{color:#0057b8}#result{font-size:14px}</style></head><body><main><h2>DPA HELP CENTER</h2><h1 id="title">Would you like help?</h1><p id="copy">Confirm below and our team will explain your preparation options and any costs before you decide.</p><button id="confirm">Yes, I’m interested</button><p id="result" role="status"></p><p><a href="/prephub/">Open PrepHub</a></p></main><script>
(()=>{const params=new URLSearchParams(location.search),job_id=params.get('job_id'),token=params.get('token'),unsubscribe=params.get('action')==='unsubscribe',button=document.getElementById('confirm'),result=document.getElementById('result');if(unsubscribe){document.getElementById('title').textContent='Stop preparation emails?';document.getElementById('copy').textContent='Confirm below to stop these preparation follow-up emails.';button.textContent='Stop these emails';}if(!job_id||!token){button.disabled=true;result.textContent='This confirmation link is incomplete. Please use the link in your email.';}button.onclick=async()=>{button.disabled=true;result.textContent='Saving your preference…';try{const r=await fetch('https://fklchtsxahepzfzgcqdp.supabase.co/functions/v1/prephub-followup-worker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:unsubscribe?'unsubscribe':'interest',job_id,token})}),data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'Your preference could not be saved.');document.getElementById('title').textContent=unsubscribe?'Preference saved':'Your interest is recorded';document.getElementById('copy').textContent=unsubscribe?'You will no longer receive this preparation email sequence.':'Our team will review your request and follow up with you.';button.hidden=true;result.textContent='Thank you.';}catch(e){result.textContent=e.message;button.disabled=false;}};})();
</script></body></html>
