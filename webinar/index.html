<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>First-Time Homebuyer Webinar | DPA Help Center</title>
<meta name="description" content="Join the DPA Help Center first-time homebuyer readiness webinar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#081f5c;--blue:#0057b8;--red:#d22630;--ink:#152348;--muted:#6e7890;--line:#dde4ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5f8fd,#fff 50%,#eef4ff);color:var(--ink);font-family:Inter,Arial,sans-serif}.top{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(18px,5vw,70px);background:#fff;border-bottom:1px solid var(--line)}.brand{color:var(--navy);font-size:19px;font-weight:950}.brand span{color:var(--red)}.live{display:flex;align-items:center;gap:7px;color:var(--navy);font-size:11px;font-weight:850}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #fff0f1}.wrap{width:min(1100px,calc(100% - 28px));margin:42px auto}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:stretch}.card{border:1px solid rgba(8,31,92,.1);border-radius:26px;background:rgba(255,255,255,.91);box-shadow:0 25px 70px rgba(8,31,92,.12)}.copy{padding:clamp(26px,5vw,56px)}.eyebrow{color:var(--blue);font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase}.copy h1{margin:14px 0;color:var(--navy);font-size:clamp(36px,5vw,62px);line-height:.98;letter-spacing:-2.5px}.copy p{max-width:680px;margin:0;color:var(--muted);font-size:15px;font-weight:650;line-height:1.65}.host{display:flex;align-items:center;gap:12px;margin-top:28px}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--navy);color:#fff;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.host strong,.host small{display:block}.host strong{color:var(--navy)}.host small{margin-top:4px;color:var(--muted);font-size:11px}.register{padding:25px}.register h2{margin:0;color:var(--navy);font-size:24px}.session{margin:12px 0 18px;border-radius:15px;background:#eff5ff;padding:13px;color:var(--navy);font-size:12px;font-weight:850}.form{display:grid;gap:10px}.form input{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit;font-size:12px;outline:none}.form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #eaf2ff}.form button,.cta{height:48px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900;letter-spacing:.3px;cursor:pointer}.fine,.status{color:var(--muted);font-size:9px;font-weight:650;line-height:1.45}.status{min-height:14px;color:var(--red)}.room{display:none;margin-top:22px;padding:18px}.room.open{display:block}.video-shell{aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:#050b1c;display:grid;place-items:center}.video-shell iframe,.video-shell video{width:100%;height:100%;border:0}.room-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}.room-head h2{margin:0;color:var(--navy)}.cta{display:none;align-items:center;justify-content:center;text-decoration:none;padding:0 22px}.cta.show{display:inline-flex}.loading{text-align:center;padding:80px 20px;color:var(--navy);font-weight:850}@media(max-width:800px){.hero{grid-template-columns:1fr}.wrap{margin:20px auto}.copy h1{font-size:40px}.room-head{align-items:flex-start;flex-direction:column}}
</style>
<link rel="stylesheet" href="/assets/dpa-design.css?v=20260930-clean">
</head>
<body data-dpa-design>
<header class="top"><div class="brand">DPA HELP <span>CENTER</span></div><div class="live">AUTOMATED WEBINAR</div></header>
<main class="wrap"><div class="loading" id="loading">Loading your webinar…</div><section class="hero" id="hero" hidden><article class="card copy"><div class="eyebrow">First-time homebuyer readiness</div><h1 id="title"></h1><p id="description"></p><div class="host"><div class="avatar" id="avatar">DD</div><div><strong id="host"></strong><small id="hostTitle"></small></div></div></article><aside class="card register"><h2>Reserve your seat</h2><div class="session" id="session"></div><form class="form" id="registration"><input id="firstName" required maxlength="100" placeholder="First name"><input id="email" required type="email" maxlength="320" placeholder="Email address"><input id="phone" inputmode="tel" maxlength="30" placeholder="Phone number (optional)"><button type="submit">RESERVE MY SEAT</button><div class="status" id="status"></div><div class="fine">By registering, you agree to receive webinar reminders and homebuyer preparation information. Message and data rates may apply.</div></form></aside></section><section class="card room" id="room"><div class="room-head"><div><div class="eyebrow">Webinar room</div><h2 id="roomTitle"></h2></div><a class="cta" id="cta" target="_top"></a></div><div class="video-shell" id="video"></div></section></main>
<script>
(function(){
const API="https://fklchtsxahepzfzgcqdp.supabase.co/functions/v1/webinar-public",params=new URLSearchParams(location.search),pathId=decodeURIComponent(location.pathname.split("/webinar/")[1]||"").replace(/^\/+|\/+$/g,""),id=params.get("id")||pathId;let webinar=null;let sessionAt=null;
const el=id=>document.getElementById(id),source=()=>params.get("utm_campaign")||params.get("utm_source")||document.referrer||"direct";
function nextSession(minute){const next=new Date();next.setSeconds(0,0);if(next.getMinutes()>=minute)next.setHours(next.getHours()+1);next.setMinutes(minute);return next}
function initials(name){return String(name||"DPA").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()}
function videoMarkup(url){if(/youtu(?:\.be|be\.com)/i.test(url)){const match=url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/);return match?`<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen src="https://www.youtube.com/embed/${match[1]}?autoplay=1&rel=0"></iframe>`:""}if(/vimeo\.com/i.test(url)){const match=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);return match?`<iframe allow="autoplay; fullscreen; picture-in-picture" allowfullscreen src="https://player.vimeo.com/video/${match[1]}?autoplay=1"></iframe>`:""}return `<video controls autoplay playsinline src="${url}"></video>`}
async function load(){try{const response=await fetch(`${API}?id=${encodeURIComponent(id)}`);const payload=await response.json();if(!response.ok)throw new Error(payload.error||"Webinar unavailable");webinar=payload.webinar;sessionAt=nextSession(Number(webinar.start_minute)||0);el("title").textContent=webinar.title;el("roomTitle").textContent=webinar.title;el("description").textContent=webinar.description;el("host").textContent=webinar.host_name;el("hostTitle").textContent=webinar.host_title;el("avatar").innerHTML=webinar.avatar_url?`<img src="${webinar.avatar_url}" alt="">`:initials(webinar.host_name);el("session").textContent=`Next session: ${new Intl.DateTimeFormat(undefined,{weekday:"short",hour:"numeric",minute:"2-digit",timeZoneName:"short"}).format(sessionAt)} · ${webinar.duration_minutes} minutes`;el("loading").hidden=true;el("hero").hidden=false}catch(error){el("loading").textContent=error.message}}
el("registration").addEventListener("submit",async event=>{event.preventDefault();const button=event.currentTarget.querySelector("button");button.disabled=true;el("status").textContent="Reserving your seat…";try{const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({webinar_id:webinar.id,first_name:el("firstName").value,email:el("email").value,phone:el("phone").value,session_at:sessionAt.toISOString(),source:source()})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||"Registration failed");el("status").textContent="You’re registered. Your webinar room is ready below.";el("room").classList.add("open");el("video").innerHTML=videoMarkup(webinar.video_url);el("cta").textContent=webinar.cta_text;el("cta").href=webinar.cta_url;setTimeout(()=>el("cta").classList.add("show"),Math.max(0,Number(webinar.cta_minute)||0)*60000);el("room").scrollIntoView({behavior:"smooth"})}catch(error){el("status").textContent=error.message}finally{button.disabled=false}});load();
})();
</script>
</body></html>
